# For the alembic CLI, e.g. `uv run alembic revision --autogenerate -m "..."`.
# The app runs migrations itself on startup (see src/ledgerline/migrate.py).
[alembic]
script_location = src/ledgerline/migrations
sqlalchemy.url = sqlite:///./ledgerline.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
