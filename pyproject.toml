[project]
name = "ledgerline"
version = "0.1.0"
description = "Payment-event ingestion and reconciliation service"
readme = "README.md"
authors = [
    { name = "Swayam" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.6",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ledgerline = "ledgerline.api:main"
ledgerline-generate = "ledgerline.tools:generate_main"
ledgerline-seed = "ledgerline.tools:seed_main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
